# Runs the checks from docs/GIT_WORKFLOW.md on every PR, on every push to main, and before every deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # deploy.yml runs these checks before it deploys

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }} # "Deploy" when called from deploy.yml, so the two never cancel each other
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # the monday code runtime (server/.mondaycoderc)
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck, tests and bundle
        run: npm run check
